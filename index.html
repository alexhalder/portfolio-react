<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/Ax.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ax - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.74/build/spline-viewer.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: transparent !important;
      }
      #root, .container, section, footer, nav {
        background: transparent !important;
      }
      .spline-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
      spline-viewer {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #root {
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="spline-background">
      <spline-viewer url="https://prod.spline.design/liLhhHDDZWOg5pge/scene.splinecode"></spline-viewer>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
